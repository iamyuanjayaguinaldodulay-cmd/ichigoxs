html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(600px 300px at 50% -80px,var(--glow),transparent),var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:32px 22px 64px}
h1{margin:0;min-width:0;font-size:clamp(1.25rem,6vw,1.7rem);font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.head{display:flex;align-items:center;justify-content:flex-start;gap:14px;margin-bottom:22px}
.pic{order:-1;flex:none;width:52px;height:52px;border-radius:14px;object-fit:cover;border:2px solid var(--ac);box-shadow:0 6px 16px var(--glow)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.tab[aria-selected="true"]{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;box-shadow:0 6px 18px var(--glow)}
.sw{position:relative;margin-bottom:18px}
.sw svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round}
input{width:100%;padding:14px 16px 14px 42px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);font:inherit}
input:focus{outline:2px solid var(--ac);border-color:transparent}
.card{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:200px;border-radius:24px;padding:22px;margin-bottom:24px;overflow:hidden;color:#fff;box-shadow:var(--sh);background:#0c0e17;border:1px solid var(--line);isolation:isolate}
.bg{position:absolute;inset:-20px;z-index:-2;background-size:cover;background-position:center;filter:blur(10px) saturate(1.2);transform:scale(1.1)}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,9,18,.88) 0%,rgba(8,9,18,.6) 55%,rgba(8,9,18,.3) 100%)}
.ic{position:relative;flex:none;width:88px;height:88px;border-radius:22px;object-fit:cover;box-shadow:0 6px 18px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.18)}
.left{position:relative;display:flex;align-items:center;gap:14px;min-width:0}
.card::after{content:"";position:absolute;inset:0;border-radius:24px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
.info{position:relative;min-width:0}
.n{font-weight:800;font-size:1.4rem;line-height:1.15;letter-spacing:-.3px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.m{margin-top:10px;font-size:.92rem;color:rgba(255,255,255,.75)}
.v{display:inline-block;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700;font-size:.8rem;border-radius:99px;padding:3px 11px;margin-right:8px}
.dl{position:relative;flex:none;display:flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .15s}
.dl:active{transform:scale(.92)}
.dl svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ban{align-items:flex-end;min-height:210px}
.ban .bg{inset:0;filter:none;transform:none}

  list.innerHTML=rows.length?rows.map(i=>'<div class="card'+(i.ban?' ban':'')+'"><div class="bg" style="background-image:url('+i.img+')"></div><div class="left">'+(i.ban?'':'<img class="ic" alt="" src="'+i.img+'">')+'<div class="info"><div class="n">'+esc(i.name)+'</div><div class="m"><span class="v">v'+esc(i.ver)+'</span>'+esc(i.size)+'</div></div></div><a class="dl" target="_blank" rel="noopener" href="'+esc(i.url)+'" aria-label="Download '+esc(i.name)+'">'+ICON+'</a></div>').join(""):'<div class="empty">—</div>';
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));render()});
q.oninput=render;render();
</script>
</body>
</html>
